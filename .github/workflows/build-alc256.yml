name: Build ALC256 Layout 103 with speaker PinConfigs

on:
  push:
    branches:
      - alc256-fx706hf
    paths:
      - .github/workflows/build-alc256.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_TYPE: KEXT
  ACID32: ''
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build:
    name: Build AppleALC x86_64
    runs-on: macos-15-intel
    env:
      JOB_TYPE: BUILD
    steps:
      - name: Checkout custom AppleALC branch
        uses: actions/checkout@v4

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Check custom ALC256 source and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -s Resources/ALC256/layout103.xml
          test -s Resources/ALC256/Platforms103.xml
          test -s Resources/ALC256/Info.plist
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --find clang
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          prefix = b'<?xml version="1.0" encoding="UTF-8"?><plist version="1.0">'
          suffix = b'</plist>'
          res = Path('Resources/ALC256')
          for name in ['layout103.xml', 'Platforms103.xml']:
              parsed = plistlib.loads(prefix + (res / name).read_bytes() + suffix)
              print('Verified:', name, type(parsed).__name__)
          info = plistlib.loads((res / 'Info.plist').read_bytes())
          print('Verified:', 'Info.plist')
          PY

      - name: Inject ALC256 layout 103 PinConfigs (speaker 49 + internal mic 77)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import plistlib

          path = Path('Resources/PinConfigs.kext/Contents/Info.plist')
          root = plistlib.loads(path.read_bytes())
          entries = root['IOKitPersonalities']['as.vit9696.AppleALC']['HDAConfigDefault']
          codec_id = 283902550
          matches = [e for e in entries if e.get('CodecID') == codec_id and e.get('LayoutID') == 49]
          assert len(matches) == 1, 'Expected exactly one working speaker Layout 49 PinConfigs entry'
          assert not any(e.get('CodecID') == codec_id and e.get('LayoutID') == 103 for e in entries), 'Layout 103 PinConfigs already exists'
          custom = copy.deepcopy(matches[0])
          custom['LayoutID'] = 103
          custom['Codec'] = 'ASUS FX706HF experimental: layout49 speaker verbs + layout77 internal mic pin 0x12'
          data = bytes(custom['ConfigData'])
          # Layout 49 disables internal mic at node 0x12 (0x400000f0);
          # set that node to the tested Ubuntu/77 pin value 0x90a60130.
          replacements = {
              '01271cf0': '01271c30',
              '01271d00': '01271d01',
              '01271e00': '01271ea6',
              '01271f40': '01271f90',
          }
          for before, after in replacements.items():
              a, b = bytes.fromhex(before), bytes.fromhex(after)
              assert data.count(a) == 1, 'Expected exactly one codec verb ' + before
              data = data.replace(a, b, 1)
          custom['ConfigData'] = data
          assert bytes.fromhex('02050010') in data, 'Realtek speaker vendor coefficient absent'
          assert bytes.fromhex('02045089') in data, 'Realtek speaker vendor coefficient absent'
          assert bytes.fromhex('01271ea6') in data, 'Internal mic pin override absent'
          entries.append(custom)
          path.write_bytes(plistlib.dumps(root, fmt=plistlib.FMT_XML, sort_keys=False))
          print('Added PinConfigs for ALC256 Layout 103, retaining working speaker 49 initialization and enabling internal mic 0x12')
          PY

      - name: Lilu Bootstrap
        shell: bash
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      - name: Build Release for Intel macOS
        run: xcodebuild -jobs 1 -configuration Release -arch x86_64

      - name: Package AppleALC.kext
        shell: bash
        run: |
          set -euo pipefail
          KEXT="$(find build -type d -name AppleALC.kext -print | sed -n '1p')"
          if [ -z "$KEXT" ]; then
            echo 'ERROR: Build finished but AppleALC.kext was not found.'
            find build -maxdepth 4 -print | head -80
            exit 1
          fi
          echo "Packaging $KEXT"
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent "$KEXT" output/AppleALC-ALC256-layout103-EXPERIMENTAL.zip

      - name: Upload custom AppleALC artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleALC-ALC256-layout103-experimental
          path: output/AppleALC-ALC256-layout103-EXPERIMENTAL.zip
          if-no-files-found: error
