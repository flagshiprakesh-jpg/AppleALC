name: Build ALC256 Layout 104 hybrid mic pins

on:
  push:
    branches:
      - alc256-fx706hf
    paths:
      - .github/workflows/build-alc256.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_TYPE: KEXT
  ACID32: ''
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build:
    name: Build AppleALC x86_64
    runs-on: macos-15-intel
    env:
      JOB_TYPE: BUILD
    steps:
      - name: Checkout custom AppleALC branch
        uses: actions/checkout@v4

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Check custom ALC256 source and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -s Resources/ALC256/layout104.xml
          test -s Resources/ALC256/Platforms104.xml
          test -s Resources/ALC256/Info.plist
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --find clang
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          prefix = b'<?xml version="1.0" encoding="UTF-8"?><plist version="1.0">'
          suffix = b'</plist>'
          res = Path('Resources/ALC256')
          for name in ['layout104.xml', 'Platforms104.xml']:
              parsed = plistlib.loads(prefix + (res / name).read_bytes() + suffix)
              print('Verified:', name, type(parsed).__name__)
          info = plistlib.loads((res / 'Info.plist').read_bytes())
          print('Verified:', 'Info.plist')
          PY

      - name: Inject ALC256 layout 104 PinConfigs (layout77 mic pins and layout49 speaker coefficients)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import plistlib

          path = Path('Resources/PinConfigs.kext/Contents/Info.plist')
          root = plistlib.loads(path.read_bytes())
          entries = root['IOKitPersonalities']['as.vit9696.AppleALC']['HDAConfigDefault']
          codec_id = 283902550
          speaker = [e for e in entries if e.get('CodecID') == codec_id and e.get('LayoutID') == 49]
          mic = [e for e in entries if e.get('CodecID') == codec_id and e.get('LayoutID') == 77]
          assert len(speaker) == len(mic) == 1, 'Expected exactly one layout49 and layout77 entry'
          assert not any(e.get('CodecID') == codec_id and e.get('LayoutID') == 104 for e in entries)
          custom = copy.deepcopy(mic[0])
          custom['LayoutID'] = 104
          custom['Codec'] = 'ASUS FX706HF experimental: retain layout77 mic pins and append layout49 speaker codec coefficients'
          existing = bytes(custom['ConfigData'])
          speaker_verbs = bytes(speaker[0]['ConfigData'])
          assert bytes.fromhex('01271c30') in existing and bytes.fromhex('01271ea6') in existing
          assert bytes.fromhex('01470c02') in existing, 'Expected layout77 EAPD speaker activation'
          # These are the four codec coefficient writes present on working Layout 49
          # and absent from working-microphone Layout 77.
          vendor_verbs = bytes.fromhex('02050010020400200205004502045089')
          assert speaker_verbs.endswith(vendor_verbs), 'Layout49 speaker coefficient sequence changed'
          assert vendor_verbs not in existing
          custom['ConfigData'] = existing + vendor_verbs
          entries.append(custom)
          path.write_bytes(plistlib.dumps(root, fmt=plistlib.FMT_XML, sort_keys=False))
          print('Added layout104 pin configs: layout77 pin routing + layout49 vendor coefficients')
          PY

      - name: Lilu Bootstrap
        shell: bash
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      - name: Build Release for Intel macOS
        run: xcodebuild -jobs 1 -configuration Release -arch x86_64

      - name: Package AppleALC.kext
        shell: bash
        run: |
          set -euo pipefail
          KEXT="$(find build -type d -name AppleALC.kext -print | sed -n '1p')"
          if [ -z "$KEXT" ]; then
            echo 'ERROR: Build finished but AppleALC.kext was not found.'
            find build -maxdepth 4 -print | head -80
            exit 1
          fi
          echo "Packaging $KEXT"
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent "$KEXT" output/AppleALC-ALC256-layout104-EXPERIMENTAL.zip

      - name: Upload custom AppleALC artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleALC-ALC256-layout104-experimental
          path: output/AppleALC-ALC256-layout104-EXPERIMENTAL.zip
          if-no-files-found: error
